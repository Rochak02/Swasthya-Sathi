<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Swasthya Sathi</title>

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- Custom CSS Design Tokens -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="relative bg-white dark:bg-black mono-text transition-colors duration-150 antialiased min-h-screen flex flex-col justify-between py-6 px-4">

  <!-- ── Floating Translucent Pill Navbar ─────────────────────────────────── -->
  <header class="w-full max-w-5xl mx-auto mb-8">
    <nav class="navbar-pill rounded-full px-6 py-3.5 flex items-center justify-between transition-all duration-300">
      <!-- Logo & Branding -->
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-full border border-black/20 dark:border-white/20 flex items-center justify-center mono-text group-hover:scale-105 transition-transform">
          <i class="fa-solid fa-heart-pulse text-lg mono-text"></i>
        </div>
        <span class="font-heading font-extrabold text-xl tracking-tight mono-text">
          Swasthya<span class="font-normal mono-text opacity-90">Sathi</span>
        </span>
      </a>

      <!-- Right Actions: Home & Theme Toggle -->
      <div class="flex items-center gap-3">
        <a href="index.html" class="btn-translucent text-xs px-4 py-2 flex items-center gap-2 mono-text">
          <i class="fa-solid fa-arrow-left text-xs mono-text"></i>
          <span>Home</span>
        </a>
        <button id="theme-toggle" class="w-10 h-10 rounded-full border border-black/20 dark:border-white/20 flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/10 transition-colors" title="Toggle Light/Dark Theme">
          <span class="dark:hidden text-black"><i class="fa-solid fa-moon"></i></span>
          <span class="hidden dark:inline text-white"><i class="fa-solid fa-sun"></i></span>
        </button>
      </div>
    </nav>
  </header>

  <!-- ── Main Sign In Container ─────────────────────────────────────────── -->
  <main class="w-full max-w-xl mx-auto my-auto">
    <div class="flat-panel rounded-[2.5rem] p-8 sm:p-12 shadow-2xl relative overflow-hidden">
      
      <!-- Top Title Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full border border-black/20 dark:border-white/20 mb-4 mono-text">
          <i class="fa-solid fa-user-lock text-2xl mono-text"></i>
        </div>
        <h1 class="font-heading font-extrabold text-3xl sm:text-4xl tracking-tight mb-2 mono-text">
          Welcome Back
        </h1>
        <p class="text-xs sm:text-sm mono-text-muted font-medium">
          Sign in to access your unified healthcare portal
        </p>
      </div>

      <!-- Error / Status Message Alert -->
      <div id="error-msg" class="hidden mb-6 p-4 rounded-2xl border text-sm font-semibold text-center transition-all"></div>

      <!-- Sign In Form -->
      <form id="login-form" class="space-y-6">
        
        <!-- Email Input -->
        <div class="space-y-2">
          <label for="email" class="block text-xs font-bold uppercase tracking-wider mono-text">
            Email Address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none mono-text-muted">
              <i class="fa-solid fa-envelope"></i>
            </div>
            <input type="email" id="email" required placeholder="name@domain.com" class="w-full pl-11 pr-4 py-3.5 rounded-2xl text-sm font-medium focus:outline-none">
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label for="password" class="block text-xs font-bold uppercase tracking-wider mono-text">
              Password
            </label>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none mono-text-muted">
              <i class="fa-solid fa-lock"></i>
            </div>
            <input type="password" id="password" required placeholder="••••••••" class="w-full pl-11 pr-12 py-3.5 rounded-2xl text-sm font-medium focus:outline-none">
            <button type="button" id="toggle-pw" class="absolute inset-y-0 right-0 pr-4 flex items-center mono-text-muted hover:opacity-100 transition-opacity">
              <i class="fa-solid fa-eye" id="pw-icon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" class="btn-primary w-full py-4 rounded-full text-base font-bold flex items-center justify-center gap-2 group">
          <span>Sign In to Portal</span>
          <i class="fa-solid fa-arrow-right text-sm group-hover:translate-x-1 transition-transform"></i>
        </button>
      </form>

      <!-- Section Divider -->
      <div class="flex items-center gap-4 my-8">
        <div class="flex-1 border-t border-black/15 dark:border-white/15"></div>
        <span class="text-xs font-bold uppercase tracking-widest mono-text opacity-70 whitespace-nowrap">
          New to Swasthya Sathi?
        </span>
        <div class="flex-1 border-t border-black/15 dark:border-white/15"></div>
      </div>

      <!-- Quick Registration Gateway Grid -->
      <div class="space-y-3">
        <p class="text-xs text-center mono-text-muted mb-2 font-medium">Select your portal to register a new account:</p>
        
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
          <a href="register/patient.html" class="btn-translucent py-2.5 px-3 text-xs flex items-center justify-center gap-1.5 rounded-xl mono-text">
            <i class="fa-solid fa-user text-xs mono-text"></i>
            <span>Patient</span>
          </a>
          <a href="register/doctor.html" class="btn-translucent py-2.5 px-3 text-xs flex items-center justify-center gap-1.5 rounded-xl mono-text">
            <i class="fa-solid fa-user-doctor text-xs mono-text"></i>
            <span>Doctor</span>
          </a>
          <a href="register/hospital.html" class="btn-translucent py-2.5 px-3 text-xs flex items-center justify-center gap-1.5 rounded-xl mono-text">
            <i class="fa-solid fa-hospital text-xs mono-text"></i>
            <span>Hospital</span>
          </a>
          <a href="register/lab.html" class="btn-translucent py-2.5 px-3 text-xs flex items-center justify-center gap-1.5 rounded-xl mono-text">
            <i class="fa-solid fa-flask text-xs mono-text"></i>
            <span>Lab</span>
          </a>
          <a href="register/advertiser.html" class="btn-translucent py-2.5 px-3 text-xs flex items-center justify-center gap-1.5 col-span-2 sm:col-span-2 rounded-xl mono-text">
            <i class="fa-solid fa-rectangle-ad text-xs mono-text"></i>
            <span>Advertiser Partner</span>
          </a>
        </div>
      </div>

    </div>
  </main>

  <!-- ── Footer ─────────────────────────────────────────────────────────── -->
  <footer class="w-full max-w-5xl mx-auto mt-8 text-center text-xs mono-text-muted">
    <p>© 2026 Swasthya Sathi Digital Health System. All rights reserved.</p>
  </footer>

  <!-- Firebase Auth & Firestore Client SDK Scripts -->
  <script type="module">
    import { auth, db } from './js/firebase-config.js';
    import { signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { toast, initDarkMode } from './js/utils.js';

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Initialize Theme Switcher
      initDarkMode();

      // 2. Toggle Password Visibility
      const passwordInput = document.getElementById('password');
      const togglePwBtn = document.getElementById('toggle-pw');
      const pwIcon = document.getElementById('pw-icon');

      if (togglePwBtn && passwordInput && pwIcon) {
        togglePwBtn.addEventListener('click', () => {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          pwIcon.classList.toggle('fa-eye');
          pwIcon.classList.toggle('fa-eye-slash');
        });
      }

      // 3. Handle Form Submission & Firebase Role Routing
      const loginForm = document.getElementById('login-form');
      const errorMsg = document.getElementById('error-msg');
      const submitBtn = document.getElementById('submit-btn');

      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          const email = document.getElementById('email').value.trim();
          const password = passwordInput.value;

          // Clear previous error messages
          errorMsg.classList.add('hidden');
          errorMsg.textContent = '';

          // Disable button & show spinner
          submitBtn.disabled = true;
          submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...`;

          try {
            // Sign in with Firebase Auth
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // Fetch user metadata role from Firestore users collection
            const userDocRef = doc(db, 'users', user.uid);
            const userDoc = await getDoc(userDocRef);

            let role = 'patient'; // Default fallback
            if (userDoc.exists()) {
              role = userDoc.data().role || 'patient';
            }

            toast('Authentication successful! Redirecting to portal...', 'success');

            // Redirect based on role
            setTimeout(() => {
              switch (role) {
                case 'doctor':
                  window.location.href = 'doctor/dashboard.html';
                  break;
                case 'hospital':
                  window.location.href = 'hospital/dashboard.html';
                  break;
                case 'lab':
                  window.location.href = 'lab/dashboard.html';
                  break;
                case 'admin':
                  window.location.href = 'admin/dashboard.html';
                  break;
                case 'advertiser':
                  window.location.href = 'advertiser/dashboard.html';
                  break;
                case 'patient':
                default:
                  window.location.href = 'patient/dashboard.html';
                  break;
              }
            }, 800);

          } catch (error) {
            console.error('Login Error:', error);
            errorMsg.classList.remove('hidden');
            errorMsg.className = 'mb-6 p-4 rounded-2xl border border-black/30 dark:border-white/30 text-black dark:text-white text-sm font-semibold text-center';
            
            let message = 'Invalid email or password. Please check your credentials.';
            if (error.code === 'auth/user-not-found') {
              message = 'No account found with this email address.';
            } else if (error.code === 'auth/wrong-password') {
              message = 'Incorrect password. Please try again.';
            } else if (error.code === 'auth/invalid-email') {
              message = 'Please enter a valid email address.';
            } else if (error.code === 'auth/too-many-requests') {
              message = 'Too many failed attempts. Please try again later.';
            }

            errorMsg.textContent = message;
            toast(message, 'error');

            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>Sign In to Portal</span><i class="fa-solid fa-arrow-right text-sm"></i>`;
          }
        });
      }
    });
  </script>
</body>
</html>
