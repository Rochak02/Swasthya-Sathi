<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Registration — Swasthya Sathi</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="relative bg-white dark:bg-black text-black dark:text-white transition-colors duration-200 antialiased min-h-screen flex flex-col justify-between py-6">

  <!-- ── Header ───────────────────────────────────────────────────────────── -->
  <header class="sticky top-4 z-50 px-4 sm:px-8 max-w-5xl mx-auto w-full">
    <nav class="navbar-pill rounded-full px-6 py-3.5 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-3 group">
        <div class="w-9 h-9 rounded-full border border-black/20 dark:border-white/20 flex items-center justify-center text-black dark:text-white">
          <i class="fa-solid fa-hospital text-base"></i>
        </div>
        <span class="font-heading font-extrabold text-lg tracking-tight text-black dark:text-white">Swasthya Sathi</span>
      </a>

      <div class="flex items-center gap-3">
        <button id="theme-toggle" type="button" class="w-9 h-9 rounded-full flex items-center justify-center border border-black/10 dark:border-white/10 text-sm">
          🌙
        </button>
        <a href="../login.html" class="px-4 py-2 btn-translucent text-xs font-bold">Already Registered? Login</a>
      </div>
    </nav>
  </header>

  <!-- ── Main Single Scrollable Card ──────────────────────────────────────── -->
  <main class="py-8 px-4 sm:px-8 max-w-3xl mx-auto w-full flex-1">
    
    <div class="flat-panel rounded-[2.5rem] p-8 sm:p-14 shadow-2xl relative">
      
      <!-- Header -->
      <div class="text-center mb-10">
        <span class="badge-minimal mb-3">Hospital Institution</span>
        <h1 class="text-3xl sm:text-5xl font-bold font-heading text-black dark:text-white">Hospital Registration</h1>
        <p class="text-neutral-500 dark:text-neutral-400 text-xs sm:text-sm mt-3">Connect your healthcare facility to the Swasthya Sathi medical network.</p>
      </div>

      <!-- Notification Toast Container -->
      <div id="toast-msg" class="hidden mb-8 p-4 rounded-2xl text-xs font-semibold text-center border"></div>

      <!-- Form -->
      <form id="hospital-form" class="space-y-6">
        
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-1.5">Hospital / Healthcare Facility Name *</label>
          <input type="text" id="name" required placeholder="City General Hospital" class="w-full px-4 py-3.5 rounded-xl bg-transparent border border-black/15 dark:border-white/15 text-sm text-black dark:text-white focus:outline-none focus:border-black dark:focus:border-white">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-1.5">Official Email *</label>
            <input type="email" id="email" required placeholder="admin@hospital.org" class="w-full px-4 py-3.5 rounded-xl bg-transparent border border-black/15 dark:border-white/15 text-sm text-black dark:text-white focus:outline-none focus:border-black dark:focus:border-white">
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-1.5">Contact Phone *</label>
            <input type="tel" id="phone" required placeholder="+91 9876543210" class="w-full px-4 py-3.5 rounded-xl bg-transparent border border-black/15 dark:border-white/15 text-sm text-black dark:text-white focus:outline-none focus:border-black dark:focus:border-white">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-1.5">Password *</label>
          <div class="relative">
            <input type="password" id="password" required placeholder="Minimum 6 characters" class="w-full px-4 py-3.5 pr-12 rounded-xl bg-transparent border border-black/15 dark:border-white/15 text-sm text-black dark:text-white focus:outline-none focus:border-black dark:focus:border-white">
            <button type="button" id="toggle-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-neutral-400 hover:text-black dark:hover:text-white">Show</button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-1.5">Hospital Category *</label>
            <select id="type" class="w-full px-4 py-3.5 rounded-xl bg-white dark:bg-black border border-black/15 dark:border-white/15 text-sm text-black dark:text-white focus:outline-none focus:border-black dark:focus:border-white">
              <option value="Government">Government Hospital</option>
              <option value="Private">Private Super Specialty</option>
              <option value="Clinic">Polyclinic / Specialty Clinic</option>
              <option value="Diagnostic Centre">Diagnostic & Medical Centre</option>
              <option value="Nursing Home">Nursing Home</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-1.5">Registration / Establishment Reg No. *</label>
            <input type="text" id="reg-number" required placeholder="REG-HOSP-2026-X" class="w-full px-4 py-3.5 rounded-xl bg-transparent border border-black/15 dark:border-white/15 text-sm text-black dark:text-white focus:outline-none focus:border-black dark:focus:border-white">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-1.5">Full Physical Address *</label>
          <textarea id="address" rows="3" required placeholder="Plot No., Street, City, State, Pincode" class="w-full px-4 py-3.5 rounded-xl bg-transparent border border-black/15 dark:border-white/15 text-sm text-black dark:text-white focus:outline-none focus:border-black dark:focus:border-white"></textarea>
        </div>

        <div class="pt-6 border-t border-black/10 dark:border-white/10">
          <button type="submit" id="submit-btn" class="w-full py-4 btn-primary text-sm font-bold flex items-center justify-center gap-2">
            <span id="btn-text">Register Hospital Facility</span>
            <i class="fa-solid fa-hospital-user text-xs"></i>
          </button>
        </div>

      </form>

    </div>

  </main>

  <!-- ── Footer ──────────────────────────────────────────────────────────── -->
  <footer class="py-6 px-4 text-center text-xs text-neutral-500 border-t border-black/10 dark:border-white/10">
    &copy; 2026 Swasthya Sathi. All rights reserved.
  </footer>

  <!-- Firebase & Logic Script -->
  <script type="module">
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { auth, db } from '../js/firebase-config.js';
    import { initDarkMode } from '../js/utils.js';

    initDarkMode();

    const toastMsg = document.getElementById('toast-msg');
    const togglePassword = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const isPass = passwordInput.type === 'password';
      passwordInput.type = isPass ? 'text' : 'password';
      togglePassword.textContent = isPass ? 'Hide' : 'Show';
    });

    function showToast(msg, isError = false) {
      toastMsg.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-500', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-500');
      if (isError) {
        toastMsg.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-500');
      } else {
        toastMsg.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-500');
      }
      toastMsg.textContent = msg;
    }

    // Form Submit
    document.getElementById('hospital-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = passwordInput.value;
      const phone = document.getElementById('phone').value;
      const type = document.getElementById('type').value;
      const regNumber = document.getElementById('reg-number').value;
      const address = document.getElementById('address').value;

      if (password.length < 6) {
        showToast("Password must be at least 6 characters.", true);
        return;
      }

      try {
        submitBtn.disabled = true;
        btnText.textContent = "Submitting Hospital Registration...";

        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCred.user;

        await setDoc(doc(db, 'users', user.uid), {
          email: user.email,
          role: 'hospital',
          verified: false,
          createdAt: serverTimestamp()
        });

        await setDoc(doc(db, 'hospitals', user.uid), {
          name: name,
          email: email,
          phone: phone,
          address: address,
          registrationNumber: regNumber,
          type: type,
          verified: false,
          uid: user.uid,
          createdAt: serverTimestamp()
        });

        showToast("Hospital Registration Submitted! Awaiting Grid Admin verification. Redirecting to Login...", false);

        setTimeout(() => {
          window.location.href = '../login.html';
        }, 2000);

      } catch (err) {
        console.error("Hospital Registration Error:", err);
        showToast(err.message || "Failed to register hospital. Please try again.", true);
        submitBtn.disabled = false;
        btnText.textContent = "Register Hospital Facility";
      }
    });
  </script>
</body>
</html>
